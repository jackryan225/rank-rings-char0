# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Regular Rank Q-Algebras Without Homomorphisms into Characteristic-Zero Matrix Ultraproducts"
  description: >
    Formalizes in Lean 4 the construction of a countable von Neumann regular Q-algebra S
    equipped with a faithful rank function admitting no unital ring homomorphism into any
    rank ultraproduct of matrix rings over characteristic-zero fields (in particular Elek's
    M^alg_nu), the analogous regular rank C-algebra, and a finite noncommutative integer
    polynomial system satisfied in S yet admitting no uniform epsilon-approximate solution
    in M_N(C) for any N >= 1. Answers a reading of Elek's Section 1.2 question
    (arXiv:1006.5378) negatively by pairing a characteristic-zero projective-plane idempotent
    incidence rank bound with a 7-adic flag tensor-power regular rank ring (63 < 64).
  authors:
    - "Jack Ryan (https://orcid.org/0009-0004-6846-7480)"
  responsible_maintainers:
    - "Jack Ryan (https://orcid.org/0009-0004-6846-7480)"
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "Regular Rank Q-Algebras Without Homomorphisms into Characteristic-Zero Matrix Ultraproducts"
    authors:
      - "Jack Ryan"
    id: "https://github.com/jackryan225/rank-rings-char0"
    type: "original-proof"
    location: "Sections 1-5 (Theorems 1.1 and 1.2, unital versions)"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >
      Original paper and Lean 4 formalization developed together. Accompanying manuscript
      is in paper/rank_rings_char0.tex (and submitted to Hexagon Math).
  - title: "Connes embeddings and von Neumann regular dimension functions"
    authors:
      - "Gábor Elek"
    id: "arXiv:1006.5378"
    type: "article"
    location: "Section 1.2"
    relationship: "background"
    note: "Source of the open problem answered negatively in the countable regular rank Q-algebra reading."

