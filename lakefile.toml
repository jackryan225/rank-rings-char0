name = "rank_rings"
defaultTargets = ["RankRings", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The proofs.
[[lean_lib]]
name = "RankRings"

# The three theorems, with the definitions of `Challenge/Statement.lean` and the proofs.
[[lean_lib]]
name = "Solution"

# The statements alone, with `sorry` in place of the proofs. Not a default target.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge.Statement"]
