name: check
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: No sorry in the proofs
        run: "! grep -rn -E 'sorry|native_decide|^axiom ' RankRings RankRings.lean Solution.lean"
      - name: Axioms
        run: |
          lake env lean Check/Axioms.lean | tee axioms.txt
          ! grep -q -E 'sorryAx|ofReduceBool|trustCompiler' axioms.txt
          test "$(grep -c 'depends on axioms' axioms.txt)" -eq 21
      - name: Same statements
        run: |
          lake build Challenge
          lake env lean Check/SameStatement.lean
          lake env lean Check/ChallengeView.lean > challenge.txt
          lake env lean Check/SolutionView.lean > solution.txt
          test -s challenge.txt
          cmp challenge.txt solution.txt
      - name: Sanity checks of the definitions
        run: |
          lake env lean Check/Sanity.lean | tee sanity.txt
          ! grep -q -E 'sorryAx|ofReduceBool|trustCompiler' sanity.txt
